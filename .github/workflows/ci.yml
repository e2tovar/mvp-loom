name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:5.26
        env:
          NEO4J_AUTH: neo4j/loom-dev-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: loom-dev-password
      LOOM_LLM_MODEL: openai/kimi-k2.5
      LOOM_CACHE_DIR: eval/fixtures/llm-cache

    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check backend/ eval/ tests/

      - name: Suite de tests
        # LOOM_EVAL_STRICT NO va aquí: el grafo aún no está sembrado en este
        # paso (eso ocurre después), así que los gates de eval deben poder
        # omitirse todavía. El modo estricto solo aplica al paso final.
        run: uv run pytest tests/ -q

      - name: Sembrar el grafo (sin clave de API — respuestas congeladas)
        run: uv run python -m eval.seed

      - name: Gates de eval en modo estricto
        env:
          LOOM_EVAL_STRICT: "1"
        run: uv run pytest tests/eval -v -rs
