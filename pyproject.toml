[project]
name = "mvp-loom"
version = "0.1.0"
description = "Loom — motor editorial de IA para ficción narrativa (M0: ingestión y segmentación)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "neo4j>=5.26",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "python-docx>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.9",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: tests unitarios sin dependencias externas",
    "integration: requieren Neo4j en ejecución (docker compose up)",
    "eval: proto-eval de segmentación (gate de CI)",
]
addopts = "-q"
